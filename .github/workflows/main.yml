name: Hproffile Actions
on: [push, workflow_dispatch]
env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: vprofile-cicd
  ECS_CLUSTER: vproapp-act
  ECS_SERVICE: vprofile-act-tdef-service-pqrafirv
  ECS_TASK_DEFINITION: vprofile-act-tdef
  CONTAINER_NAME: vproapp
jobs:
  Testing:
    runs-on: ubuntu-26.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full git history so Sonar can tell new code from old
      
      - name: Maven test
        run: mvn test jacoco:report

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # Sonar scanners now require Java 21 (11 and 17 are no longer supported)
      - name: Set Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

  BUILD_AND_PUBLISH:
    needs: Testing
    # Only main gets built and deployed to ECS (DEPLOY is skipped along with this job)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Update application.properties with RDS details
        env:
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASS: ${{ secrets.RDS_PASS }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        run: |
          for s in RDS_USER RDS_PASS RDS_ENDPOINT; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is not set"; exit 1; }
          done

          # Escape characters sed treats specially (\ & |) so values are written as-is
          esc() { printf '%s' "$1" | sed 's/[\\&|]/\\&/g'; }

          f=src/main/resources/application.properties
          sed -i "s|^jdbc.username=.*|jdbc.username=$(esc "$RDS_USER")|" "$f"
          sed -i "s|^jdbc.password=.*|jdbc.password=$(esc "$RDS_PASS")|" "$f"
          sed -i "/^jdbc.url=/s|//db01:|//$(esc "$RDS_ENDPOINT"):|" "$f"

      - name: Build & push image to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push --all-tags "$REGISTRY/$ECR_REPOSITORY"

  DEPLOY:
    needs: BUILD_AND_PUBLISH
    runs-on: ubuntu-26.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Fetch the current task definition from ECS and point it at this run's image
      - name: Set new image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets.REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.run_number }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

        
        
