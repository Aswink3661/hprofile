name: Hproffile Actions
on: workflow_dispatch
env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: vprofile-cicd
jobs:
  Testing:
    runs-on: ubuntu-26.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full git history so Sonar can tell new code from old
      
      - name: Maven test
        run: mvn test jacoco:report

      - name: Checkstyle
        run: mvn checkstyle:checkstyle

      # Sonar scanners now require Java 21 (11 and 17 are no longer supported)
      - name: Set Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_URL }}

  BUILD_AND_PUBLISH:
    needs: Testing
    runs-on: ubuntu-26.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Update application.properties with RDS details
        env:
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_PASS: ${{ secrets.RDS_PASS }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
        run: |
          for s in RDS_USER RDS_PASS RDS_ENDPOINT; do
            [ -n "${!s}" ] || { echo "::error::Secret $s is not set"; exit 1; }
          done

          # Escape characters sed treats specially (\ & |) so values are written as-is
          esc() { printf '%s' "$1" | sed 's/[\\&|]/\\&/g'; }

          f=src/main/resources/application.properties
          sed -i "s|^jdbc.username=.*|jdbc.username=$(esc "$RDS_USER")|" "$f"
          sed -i "s|^jdbc.password=.*|jdbc.password=$(esc "$RDS_PASS")|" "$f"
          sed -i "/^jdbc.url=/s|//db01:|//$(esc "$RDS_ENDPOINT"):|" "$f"

      - name: Build & push image to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push --all-tags "$REGISTRY/$ECR_REPOSITORY"

        
        
